name: CI

on:
  pull_request:
  push:
    branches: [main, integration/sprint-01]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Record backend resource baseline
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import resource

          def statm_rss(pid):
              page = os.sysconf("SC_PAGE_SIZE")
              return int(Path(f"/proc/{pid}/statm").read_text().split()[1]) * page

          meminfo = dict(
              line.split(":", 1)
              for line in Path("/proc/meminfo").read_text().splitlines()
          )
          cgroup = Path("/sys/fs/cgroup")
          print(f"pytest_pid={os.getpid()}")
          print(f"pytest_rss_bytes={statm_rss(os.getpid())}")
          print(f"mem_available_bytes={int(meminfo['MemAvailable'].split()[0]) * 1024}")
          for name in ("memory.max", "memory.current"):
              path = cgroup / name
              if path.exists():
                  print(f"{name.replace('.', '_')}={path.read_text().strip()}")
          print(f"rlimit_as={resource.getrlimit(resource.RLIMIT_AS)}")
          print("aggregate_rss_budget_bytes=1073741824")
          print("supervisor_rss_budget_bytes=251658240")
          print("worker_address_budget_bytes=268435456")
          PY
      - name: Run tests
        # Keep the resource-sensitive suites in fresh pytest processes. The
        # production preflight must remain enabled and every command is
        # fail-fast; these are isolation boundaries, not skipped tests.
        run: |
          python -m pytest tests \
            --ignore=tests/unit/optimization/test_comparison_runner.py \
            --ignore=tests/integration/optimization/test_comparison_calculation.py \
            --ignore=tests/integration/optimization/test_comparison_supervision_v2.py \
            --ignore=tests/unit/optimization/test_sequential_runner.py \
            -q -ra
          python -m pytest tests/integration/optimization/test_comparison_calculation.py -q -ra
          python -m pytest tests/integration/optimization/test_comparison_supervision_v2.py -q -ra
          python -m pytest tests/unit/optimization/test_sequential_runner.py -q -ra
          python -m pytest tests/unit/optimization/test_comparison_runner.py -q -ra

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          npm ci
      - name: Install isolated PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Install managed Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E desktop and mobile
        # The B02 migration smoke must start with an empty isolated database:
        # its --prepare downgrade intentionally rejects existing v2 rows.
        # Run it once in a fresh Playwright server, then run every other
        # critical E2E test in a second fresh server.
        run: |
          npx playwright test --grep "TA-043 B02 smoke: historia v1 y FF intacta después del upgrade PostgreSQL"
          npx playwright test --grep-invert "TA-043 B02 smoke: historia v1 y FF intacta después del upgrade PostgreSQL"
