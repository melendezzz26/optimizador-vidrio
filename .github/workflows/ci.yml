name: CI

on:
  pull_request:
  push:
    branches: [main, integration/sprint-01]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install isolated PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest tests -q -ra

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWGLASS_REQUIRE_POSTGRES: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          npm ci
      - name: Install isolated PostgreSQL binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          echo "NEWGLASS_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Install managed Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E desktop and mobile
        run: npm run test:e2e
