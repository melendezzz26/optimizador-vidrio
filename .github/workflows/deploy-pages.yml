name: Deploy Pages Staging

on:
  push:
    branches: [integration/sprint-01]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-staging
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/integration/sprint-01'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pages:
    if: github.ref == 'refs/heads/integration/sprint-01'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Staging
        run: npm run build:staging
      - name: Inspect Pages artifact
        run: npm run check:staging
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v5
